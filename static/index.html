<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeskHop ERP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<aside class="sidebar">
  <div class="brand">DeskHop <span>ERP</span></div>
  <nav id="nav"></nav>
  <a class="switch" href="/teak.html">🪑 ร้านเฟอร์นิเจอร์ไม้สัก →</a>
</aside>
<main>
  <header class="topbar">
    <h1 id="page-title">แดชบอร์ด</h1>
    <button id="add-btn" class="btn primary" hidden>+ เพิ่มรายการ</button>
  </header>
  <section id="content"></section>
</main>
<dialog id="dlg">
  <form id="dlg-form" method="dialog">
    <h2 id="dlg-title"></h2>
    <div id="dlg-fields" class="fields"></div>
    <p id="dlg-error" class="error"></p>
    <div class="actions">
      <button type="button" class="btn" id="dlg-cancel">ยกเลิก</button>
      <button type="submit" class="btn primary">บันทึก</button>
    </div>
  </form>
</dialog>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
